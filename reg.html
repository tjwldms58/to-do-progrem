<title>힐마루케어 회복관리 입력 v34.29</title>
<!-- 완전 오프라인: 외부 CDN 없음. 자체 수식엔진 + 자체 ZIP 내장 -->
<script>

/* ===== 힐마루 자체 수식엔진 (오프라인 내장, HyperFormula 대체) ===== */
const Engine=(function(){
  let WBREF=null, OVER=null, cache=null, computing=null;
  function colNum(s){let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n;}
  function colStr(n){let s="";while(n>0){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
  function key(sheet,coord){return sheet+"!"+coord;}
  // 셀 원본값(수식 or 리터럴). OVER(사용자입력) 우선.
  function rawCell(sheet,coord){
    const k=key(sheet,coord);
    if(OVER&&Object.prototype.hasOwnProperty.call(OVER,k)){
      const v=OVER[k];
      if(v!==undefined&&v!==null&&v!=="")return v;
      // 사용자가 비운 칸: 원본이 수식이면 수식 유지(예: =TODAY()), 아니면 빈값
      const orig=(WBREF.cells[sheet]||{})[coord];
      if(typeof orig==="string"&&orig[0]==="=")return orig;
      return "";
    }
    const c=(WBREF.cells[sheet]||{})[coord];
    return (c===undefined?null:c);
  }
  function evalCell(sheet,coord){
    const k=key(sheet,coord);
    if(cache.has(k))return cache.get(k);
    if(computing.has(k)){return 0;} // 순환참조 방지
    computing.add(k);
    let out;
    const raw=rawCell(sheet,coord);
    try{
      if(typeof raw==="string"&&raw[0]==="="){ out=evalFormula(raw.slice(1),sheet); }
      else if(raw===null||raw===undefined||raw===""){ out=""; }
      else if(typeof raw==="number"){ out=raw; }
      else { const n=Number(raw); out=(raw!==""&&!isNaN(n)&&/^-?\d*\.?\d+$/.test(String(raw).trim()))?n:raw; }
    }catch(e){ out={__err:String(e.message||e)}; }
    computing.delete(k); cache.set(k,out); return out;
  }
  // ---- 토크나이저 + 파서 (재귀하강) ----
  function tokenize(s){
    const T=[]; let i=0;
    const re={ws:/\s/, num:/[0-9.]/};
    while(i<s.length){
      const ch=s[i];
      if(re.ws.test(ch)){i++;continue;}
      if(ch==='"'){ let j=i+1,str="";while(j<s.length){ if(s[j]==='"'){ if(s[j+1]==='"'){str+='"';j+=2;continue;} break;} str+=s[j++]; } T.push({t:"str",v:str}); i=j+1; continue; }
      if(ch==="'"){ // 'Sheet name'!Ref
        let j=i+1,nm="";while(j<s.length&&s[j]!=="'"){nm+=s[j++];} j++; // skip closing '
        // expect !Ref
        let ref=""; if(s[j]==="!"){j++; while(j<s.length&&/[A-Za-z0-9$:.]/.test(s[j])){ref+=s[j++];}}
        T.push({t:"ref",sheet:nm,ref:ref}); i=j; continue;
      }
      if(re.num.test(ch)){ let j=i,nm="";while(j<s.length&&/[0-9.]/.test(s[j]))nm+=s[j++]; T.push({t:"num",v:parseFloat(nm)}); i=j; continue; }
      if(/[A-Za-z_$]/.test(ch)){
        let j=i,nm="";while(j<s.length&&/[A-Za-z0-9_$.]/.test(s[j]))nm+=s[j++];
        // function?  next non-space is '('
        let k2=j; while(k2<s.length&&/\s/.test(s[k2]))k2++;
        if(s[k2]==="("){ T.push({t:"func",v:nm.toUpperCase()}); i=k2+1; T.push({t:"("}); continue; }
        // sheet ref without quotes:  Name!A1  (no spaces) -> already in nm if contained ! ? '!' not in regex
        if(s[j]==="!"){ let ref="";let jj=j+1;while(jj<s.length&&/[A-Za-z0-9$:.]/.test(s[jj]))ref+=s[jj++]; T.push({t:"ref",sheet:nm,ref:ref}); i=jj; continue; }
        // cell or range or boolean
        const up=nm.toUpperCase();
        if(up==="TRUE"){T.push({t:"num",v:1});i=j;continue;}
        if(up==="FALSE"){T.push({t:"num",v:0});i=j;continue;}
        if(s[j]===":"){ let jj=j+1,r2=""; while(jj<s.length&&/[A-Za-z0-9$]/.test(s[jj]))r2+=s[jj++]; T.push({t:"ref",sheet:null,ref:nm+":"+r2}); i=jj; continue; }
        T.push({t:"ref",sheet:null,ref:nm});
        i=j; continue;
      }
      if(ch==="("){T.push({t:"("});i++;continue;}
      if(ch===")"){T.push({t:")"});i++;continue;}
      if(ch===","){T.push({t:","});i++;continue;}
      if(ch==="&"){T.push({t:"op",v:"&"});i++;continue;}
      if("+-*/^".includes(ch)){T.push({t:"op",v:ch});i++;continue;}
      if("<>=".includes(ch)){ let op=ch;i++; if((ch==="<"||ch===">")&&s[i]==="="){op+="=";i++;} else if(ch==="<"&&s[i]===">"){op+=">";i++;} T.push({t:"op",v:op}); continue; }
      i++; // skip unknown
    }
    return T;
  }
  function parse(T,ctxSheet){
    let p=0;
    function peek(){return T[p];}
    function next(){return T[p++];}
    function parseExpr(){return parseCompare();}
    function parseCompare(){ let l=parseConcat(); while(peek()&&peek().t==="op"&&["=","<>","<",">","<=",">="].includes(peek().v)){const op=next().v;const r=parseConcat();l={n:"bin",op,l,r};} return l; }
    function parseConcat(){ let l=parseAdd(); while(peek()&&peek().t==="op"&&peek().v==="&"){next();const r=parseAdd();l={n:"bin",op:"&",l,r};} return l; }
    function parseAdd(){ let l=parseMul(); while(peek()&&peek().t==="op"&&(peek().v==="+"||peek().v==="-")){const op=next().v;const r=parseMul();l={n:"bin",op,l,r};} return l; }
    function parseMul(){ let l=parsePow(); while(peek()&&peek().t==="op"&&(peek().v==="*"||peek().v==="/")){const op=next().v;const r=parsePow();l={n:"bin",op,l,r};} return l; }
    function parsePow(){ let l=parseUnary(); while(peek()&&peek().t==="op"&&peek().v==="^"){next();const r=parseUnary();l={n:"bin",op:"^",l,r};} return l; }
    function parseUnary(){ if(peek()&&peek().t==="op"&&peek().v==="-"){next();return {n:"neg",e:parseUnary()};} if(peek()&&peek().t==="op"&&peek().v==="+"){next();return parseUnary();} return parsePrimary(); }
    function parsePrimary(){
      const tk=next();
      if(!tk)return {n:"lit",v:""};
      if(tk.t==="num")return {n:"lit",v:tk.v};
      if(tk.t==="str")return {n:"lit",v:tk.v};
      if(tk.t==="("){ const e=parseExpr(); if(peek()&&peek().t===")")next(); return e; }
      if(tk.t==="func"){ const args=[]; if(peek()&&peek().t==="(")next(); /* '(' 토큰 소비 */ if(peek()&&peek().t===")"){next();return {n:"call",f:tk.v,args};} while(true){ args.push(parseExpr()); const c=next(); if(!c||c.t===")")break; /* comma 계속 */ } return {n:"call",f:tk.v,args}; }
      if(tk.t==="ref"){ return {n:"ref",sheet:tk.sheet||ctxSheet,ref:tk.ref}; }
      return {n:"lit",v:""};
    }
    const ast=parseExpr();
    return ast;
  }
  // ---- 값 헬퍼 ----
  function isErr(v){return v&&typeof v==="object"&&v.__err!==undefined;}
  function toNum(v){ if(isErr(v))throw new Error(v.__err); if(v===""||v===null||v===undefined)return 0; if(typeof v==="number")return v; if(v===true)return 1; if(v===false)return 0; const n=Number(v); if(isNaN(n))return 0; return n; }
  function toStr(v){ if(isErr(v))throw new Error(v.__err); if(v===null||v===undefined)return ""; if(v===true)return "TRUE"; if(v===false)return "FALSE"; return String(v); }
  function toBool(v){ if(typeof v==="number")return v!==0; if(typeof v==="boolean")return v; if(v==="")return false; return !!v; }
  function isBlank(v){return v===""||v===null||v===undefined;}
  function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  // 범위 확장 -> 셀 좌표 배열(평탄) 또는 2D
  function expandRange(sheet,ref){
    // ref like A1:B5  or A1
    const parts=ref.split(":");
    const pa=parts[0].replace(/\$/g,""), pb=(parts[1]||parts[0]).replace(/\$/g,"");
    const ma=pa.match(/^([A-Z]+)(\d+)$/), mb=pb.match(/^([A-Z]+)(\d+)$/);
    if(!ma||!mb)return [];
    let c1=colNum(ma[1]),r1=+ma[2],c2=colNum(mb[1]),r2=+mb[2];
    if(c1>c2){const t=c1;c1=c2;c2=t;} if(r1>r2){const t=r1;r1=r2;r2=t;}
    const cells=[];
    for(let r=r1;r<=r2;r++){const rowArr=[];for(let c=c1;c<=c2;c++){rowArr.push({sheet,coord:colStr(c)+r});}cells.push(rowArr);}
    return cells;
  }
  function flat2vals(cells){const out=[];for(const row of cells)for(const cc of row)out.push(evalCell(cc.sheet,cc.coord));return out;}
  // 조건 매칭 (COUNTIF/SUMIF criteria)
  function matchCrit(val,crit){
    let c=crit; if(typeof c==="number")c=String(c);
    c=String(c);
    let op="=",rhs=c;
    const m=c.match(/^(<=|>=|<>|<|>|=)(.*)$/);
    if(m){op=m[1];rhs=m[2];}
    const rn=Number(rhs); const isNum=(rhs!==""&&!isNaN(rn));
    const vn=Number(val); const vIsNum=(val!==""&&val!==null&&!isNaN(vn));
    if(op==="="){ if(isNum&&vIsNum)return vn===rn; return String(val)===String(rhs); }
    if(op==="<>"){ if(isNum&&vIsNum)return vn!==rn; return String(val)!==String(rhs); }
    if(vIsNum&&isNum){ if(op==="<")return vn<rn; if(op===">")return vn>rn; if(op==="<=")return vn<=rn; if(op===">=")return vn>=rn; }
    return false;
  }
  // ---- 평가 ----
  function ev(node,sheet){
    switch(node.n){
      case "lit": return node.v;
      case "neg": return -toNum(ev(node.e,sheet));
      case "ref": {
        if(/:/.test(node.ref)){ return {__range:expandRange(node.sheet||sheet,node.ref)}; }
        if(/^[A-Z]+\d+$/.test(node.ref)){ return evalCell(node.sheet||sheet,node.ref); }
        return node.ref; // bareword (e.g. named) -> as string
      }
      case "bin": {
        const op=node.op;
        if(op==="&")return toStr(ev(node.l,sheet))+toStr(ev(node.r,sheet));
        if(["=","<>","<",">","<=",">="].includes(op)){
          let a=ev(node.l,sheet),b=ev(node.r,sheet);
          if(isErr(a))throw new Error(a.__err); if(isErr(b))throw new Error(b.__err);
          const an=Number(a),bn=Number(b);
          const bothNum=(a!==""&&b!==""&&!isNaN(an)&&!isNaN(bn)&&typeof a!=="string"||(!isNaN(an)&&!isNaN(bn)&&a!==""&&b!==""));
          let res;
          if(!isNaN(an)&&!isNaN(bn)&&a!==""&&b!==""&&a!==null&&b!==null){
            if(op==="=")res=an===bn; else if(op==="<>")res=an!==bn; else if(op==="<")res=an<bn; else if(op===">")res=an>bn; else if(op==="<=")res=an<=bn; else res=an>=bn;
          }else{
            const as=toStr(a),bs=toStr(b);
            if(op==="=")res=as===bs; else if(op==="<>")res=as!==bs; else if(op==="<")res=as<bs; else if(op===">")res=as>bs; else if(op==="<=")res=as<=bs; else res=as>=bs;
          }
          return res?true:false;
        }
        const l=toNum(ev(node.l,sheet)),r=toNum(ev(node.r,sheet));
        if(op==="+")return l+r; if(op==="-")return l-r; if(op==="*")return l*r;
        if(op==="/")return r===0?{__err:"#DIV/0!"}:l/r; if(op==="^")return Math.pow(l,r);
        return "";
      }
      case "call": return callFn(node.f,node.args,sheet);
    }
    return "";
  }
  function argRangeVals(arg,sheet){ const v=ev(arg,sheet); if(v&&v.__range)return flat2vals(v.__range); return [v]; }
  function callFn(f,args,sheet){
    switch(f){
      case "IF":{ const c=ev(args[0],sheet); if(isErr(c))throw new Error(c.__err); return toBool(c)?ev(args[1],sheet):(args[2]!==undefined?ev(args[2],sheet):false); }
      case "IFERROR":{ try{ const v=ev(args[0],sheet); if(isErr(v))return ev(args[1],sheet); return v; }catch(e){ return ev(args[1],sheet); } }
      case "OR":{ for(const a of args){ const vs=argRangeVals(a,sheet); for(const v of vs)if(toBool(v))return true;} return false; }
      case "AND":{ for(const a of args){ const vs=argRangeVals(a,sheet); for(const v of vs)if(!toBool(v))return false;} return true; }
      case "NOT":return !toBool(ev(args[0],sheet));
      case "SUM":{ let s=0; for(const a of args){ for(const v of argRangeVals(a,sheet)){ if(!isBlank(v)&&!isNaN(Number(v)))s+=Number(v);} } return s; }
      case "COUNT":{ let n=0; for(const a of args)for(const v of argRangeVals(a,sheet)){ if(!isBlank(v)&&!isNaN(Number(v)))n++; } return n; }
      case "COUNTA":{ let n=0; for(const a of args)for(const v of argRangeVals(a,sheet)){ if(!isBlank(v))n++; } return n; }
      case "COUNTBLANK":{ let n=0; for(const a of args)for(const v of argRangeVals(a,sheet)){ if(isBlank(v))n++; } return n; }
      case "MAX":{ let m=-Infinity,any=false; for(const a of args)for(const v of argRangeVals(a,sheet)){ if(!isBlank(v)&&!isNaN(Number(v))){m=Math.max(m,Number(v));any=true;} } return any?m:0; }
      case "MIN":{ let m=Infinity,any=false; for(const a of args)for(const v of argRangeVals(a,sheet)){ if(!isBlank(v)&&!isNaN(Number(v))){m=Math.min(m,Number(v));any=true;} } return any?m:0; }
      case "COUNTIF":{ const rng=ev(args[0],sheet); const crit=ev(args[1],sheet); const vs=(rng&&rng.__range)?flat2vals(rng.__range):[rng]; let n=0; for(const v of vs)if(matchCrit(v,crit))n++; return n; }
      case "SUMIF":{ const rng=ev(args[0],sheet); const crit=ev(args[1],sheet); const sumr=args[2]?ev(args[2],sheet):rng;
        const rc=(rng&&rng.__range)?rng.__range:[[{sheet,coord:null}]];
        const sc=(sumr&&sumr.__range)?sumr.__range:rc;
        const rv=flat2vals(rc), sv=flat2vals(sc); let s=0; for(let i=0;i<rv.length;i++){ if(matchCrit(rv[i],crit)){ const x=Number(sv[i]); if(!isNaN(x))s+=x; } } return s; }
      case "COUNTIFS":{ let ranges=[],crits=[]; for(let i=0;i<args.length;i+=2){ ranges.push(flat2vals((ev(args[i],sheet)||{}).__range||[])); crits.push(ev(args[i+1],sheet)); } let n=0; const len=ranges[0].length; for(let r=0;r<len;r++){ let ok=true; for(let c=0;c<ranges.length;c++){ if(!matchCrit(ranges[c][r],crits[c])){ok=false;break;} } if(ok)n++; } return n; }
      case "ISNUMBER":{ const v=ev(args[0],sheet); return (!isBlank(v)&&typeof v==="number")||(!isBlank(v)&&!isNaN(Number(v))&&typeof v!=="boolean"&&/^-?\d*\.?\d+$/.test(String(v).trim())); }
      case "ISBLANK":return isBlank(ev(args[0],sheet));
      case "VALUE":{ const v=ev(args[0],sheet); const n=Number(v); return isNaN(n)?{__err:"#VALUE!"}:n; }
      case "LEFT":{ const s=toStr(ev(args[0],sheet)); const n=args[1]?toNum(ev(args[1],sheet)):1; return s.slice(0,n); }
      case "RIGHT":{ const s=toStr(ev(args[0],sheet)); const n=args[1]?toNum(ev(args[1],sheet)):1; return s.slice(s.length-n); }
      case "MID":{ const s=toStr(ev(args[0],sheet)); const st=toNum(ev(args[1],sheet)); const n=toNum(ev(args[2],sheet)); return s.substr(st-1,n); }
      case "LEN":return toStr(ev(args[0],sheet)).length;
      case "TRIM":return toStr(ev(args[0],sheet)).trim();
      case "SEARCH":{ const find=toStr(ev(args[0],sheet)).toLowerCase(); const within=toStr(ev(args[1],sheet)).toLowerCase(); const st=args[2]?toNum(ev(args[2],sheet)):1; const idx=within.indexOf(find,st-1); return idx<0?{__err:"#VALUE!"}:idx+1; }
      case "FIND":{ const find=toStr(ev(args[0],sheet)); const within=toStr(ev(args[1],sheet)); const st=args[2]?toNum(ev(args[2],sheet)):1; const idx=within.indexOf(find,st-1); return idx<0?{__err:"#VALUE!"}:idx+1; }
      case "TODAY":return todayStr();
      case "DATEDIF":{ try{ const a=new Date(toStr(ev(args[0],sheet))); const b=new Date(toStr(ev(args[1],sheet))); const u=toStr(ev(args[2],sheet)).toUpperCase(); const ms=b-a; const days=Math.floor(ms/86400000); if(u==="D")return days; if(u==="M")return Math.floor(days/30); if(u==="Y")return Math.floor(days/365); return days; }catch(e){return {__err:"#VALUE!"};} }
      case "ROUND":{ const v=toNum(ev(args[0],sheet)); const d=args[1]?toNum(ev(args[1],sheet)):0; const p=Math.pow(10,d); return Math.round(v*p)/p; }
      case "ROUNDDOWN":{ const v=toNum(ev(args[0],sheet)); const d=args[1]?toNum(ev(args[1],sheet)):0; const p=Math.pow(10,d); return Math.floor(v*p)/p; }
      case "ROUNDUP":{ const v=toNum(ev(args[0],sheet)); const d=args[1]?toNum(ev(args[1],sheet)):0; const p=Math.pow(10,d); return Math.ceil(v*p)/p; }
      case "ABS":return Math.abs(toNum(ev(args[0],sheet)));
      case "INT":return Math.floor(toNum(ev(args[0],sheet)));
      case "CONCATENATE":{ let s="";for(const a of args)s+=toStr(ev(a,sheet)); return s; }
      case "MATCH":{ const lv=ev(args[0],sheet); const rng=ev(args[1],sheet); const mt=args[2]?toNum(ev(args[2],sheet)):1; const vs=(rng&&rng.__range)?flat2vals(rng.__range):[rng];
        if(mt===0){ for(let i=0;i<vs.length;i++){ if(matchCrit(vs[i],lv)|| String(vs[i])===String(lv))return i+1; } return {__err:"#N/A"}; }
        // approximate (assume sorted ascending)
        let pos=-1; for(let i=0;i<vs.length;i++){ const n=Number(vs[i]); if(!isNaN(n)&&n<=Number(lv))pos=i; } return pos<0?{__err:"#N/A"}:pos+1; }
      case "INDEX":{ const rng=ev(args[0],sheet); const r=toNum(ev(args[1],sheet)); const c=args[2]?toNum(ev(args[2],sheet)):1;
        if(rng&&rng.__range){ const grid=rng.__range; if(grid.length===1){ const row=grid[0]; const cell=row[(r||c)-1]; return cell?evalCell(cell.sheet,cell.coord):""; } if(grid[0].length===1){ const cell=grid[(r)-1]?grid[r-1][0]:null; return cell?evalCell(cell.sheet,cell.coord):""; } const cell=grid[r-1]?grid[r-1][c-1]:null; return cell?evalCell(cell.sheet,cell.coord):""; } return ""; }
      case "VLOOKUP":{ const lv=ev(args[0],sheet); const rng=ev(args[1],sheet); const col=toNum(ev(args[2],sheet)); const exact=args[3]!==undefined?toBool(ev(args[3],sheet)):true;
        if(!rng||!rng.__range)return {__err:"#N/A"}; const grid=rng.__range;
        for(let i=0;i<grid.length;i++){ const first=evalCell(grid[i][0].sheet,grid[i][0].coord); if(matchCrit(first,lv)||String(first)===String(lv)){ const cell=grid[i][col-1]; return cell?evalCell(cell.sheet,cell.coord):""; } }
        if(!exact){ let best=null; for(let i=0;i<grid.length;i++){ const first=Number(evalCell(grid[i][0].sheet,grid[i][0].coord)); if(!isNaN(first)&&first<=Number(lv))best=grid[i]; } if(best){const cell=best[col-1];return cell?evalCell(cell.sheet,cell.coord):"";} }
        return {__err:"#N/A"}; }
      case "RANK":{ const v=toNum(ev(args[0],sheet)); const rng=ev(args[1],sheet); const ord=args[2]?toNum(ev(args[2],sheet)):0; const vs=((rng&&rng.__range)?flat2vals(rng.__range):[]).map(Number).filter(x=>!isNaN(x)); let r=1; for(const x of vs){ if(ord===0){ if(x>v)r++; } else { if(x<v)r++; } } return r; }
      default: return {__err:"#NAME?"};
    }
  }
  function evalFormula(src,sheet){
    const T=tokenize(src); const ast=parse(T,sheet); const v=ev(ast,sheet);
    if(isErr(v))return v;
    if(v===true)return "TRUE"; if(v===false)return "FALSE"; // excel-ish; but many IFs return strings already
    return v;
  }
  return {
    init(wb){ WBREF=wb; },
    setOverrides(over){ OVER=over; cache=new Map(); computing=new Set(); },
    get(sheet,coord){
      if(!cache)cache=new Map(); if(!computing)computing=new Set();
      let v=evalCell(sheet,coord);
      if(isErr(v))return "";
      if(v===true)return "TRUE"; if(v===false)return "FALSE";
      return (v===null||v===undefined)?"":v;
    }
  };
})();


/* ===== 순수 JS ZIP 리더/라이터 (JSZip 대체, 오프라인) ===== */
const MiniZip=(function(){
  // ---- CRC32 ----
  let CRC=null;
  function crcTable(){ if(CRC)return CRC; CRC=new Uint32Array(256); for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CRC[n]=c>>>0;} return CRC; }
  function crc32(buf){ const t=crcTable(); let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  // ---- UTF8 ----
  const enc=new TextEncoder(); const dec=new TextDecoder();

<script>
const CFG=JSON.parse(document.getElementById('cfg').textContent);
const WB=JSON.parse(document.getElementById('wbcells').textContent);
const B64=document.getElementById('b64').textContent.trim();
const FUB64=(document.getElementById('fub64')||{textContent:""}).textContent.trim();
const SCHEDB64=(document.getElementById('schedb64')||{textContent:""}).textContent.trim();
const ORDER=CFG.order, TM=CFG.tabmeta, SCHEMA=CFG.schema, SECT=CFG.sections, CALC=CFG.calc;

// ---------- state ----------
let state={patients:[], folderList:[]};
let dashSelectedFolder='all'; // [v33.6] 등록대상자 대시보드 폴더 선택 상태
function newVisit(date,fields){return {date:date,fields:JSON.parse(JSON.stringify(fields))};}
function blankPatient(name){return {name:name,visits:[newVisit(new Date().toISOString().slice(0,10),CFG.empty)]};}
function examplePatient(){return {name:"서지은(예시)",visits:[newVisit("2026-06-21",CFG.example)]};}
let cp=0, cv=0;
/* ===== v6.5 자동저장(브라우저 로컬) + 새로고침 보호 ===== */
let LS_KEY="hilmaru_care_autosave_v6"; // [v16.1] 로그인 계정에 따라 initPatientAppData()에서 재설정됨(계정별 데이터 격리)
let dirty=false;
function markDirty(){ dirty=true; autosave(); }
function autosave(){
  // [v34.29] 브라우저 저장(localStorage)은 하지 않음 — 저장은 Firebase에만 (용량 초과 문제 해결)
  dirty=false;
  if(window.hilmaruFileSave) window.hilmaruFileSave();   // → Firebase 자동저장 예약
}
function tryRestore(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    if(!d||!d.state||!d.state.patients||!d.state.patients.length) return false;
    state=d.state;
    if(!Array.isArray(state.cancelled)) state.cancelled=[];
    if(!Array.isArray(state.folderList)) state.folderList=[];
    cp=(d.cp!=null&&d.cp<state.patients.length)?d.cp:0;
    cv=(d.cv!=null&&state.patients[cp]&&d.cv<state.patients[cp].visits.length)?d.cv:0;
    return true;
  }catch(e){ return false; }
}
function clearAutosave(){
  if(!confirm("브라우저에 자동저장된 모든 입력을 삭제하고 예시 데이터로 초기화할까요?\n(되돌릴 수 없습니다. 필요하면 먼저 [전체 백업]으로 JSON을 받아두세요.)")) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  location.reload();
}
function curFields(){return state.patients[cp].visits[cv].fields;}

// ---------- 자체 계산엔진 (오프라인 내장, HyperFormula 대체) ----------
function buildEngine(){
  // 입력 8시트만 평가에 필요(09 핵심요약이 다른 시트 참조). 워크북 전체 셀을 엔진에 주입.
  const wbForEngine={cells:{}};
  for(const sn of ORDER){ wbForEngine.cells[sn]=WB.cells[sn]||{}; }
  Engine.init(wbForEngine);
}
function recalc(){
  // 사용자 입력을 시트!좌표 -> 값 오버라이드로 변환
  const f=curFields();
  const over={};
  for(const sn of ORDER){
    for(const fld of SCHEMA[sn]){
      const key=sn+"!"+fld.coord;
      let v=f[key]; if(v===undefined)v="";
      if(fld.type==="number" && v!=="" && v!==null && !isNaN(Number(v))) v=Number(v);
      over[key]=v;
    }
  }
  Engine.setOverrides(over);
}
function getCalc(sn,coord){
  let v=Engine.get(sn,coord);
  if(v===null||v===undefined)return "";
  return v;
}
// ---------- UI build ----------
let TABS_META=[];
let lastActiveKind='dashboard'; // 'dashboard' | 'visit' | 'cancelled'
function buildTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML="";
  const items=[];
  items.push({ids:['panel-dashboard'],label:'🏠 대시보드',color:'#0ea5e9',onshow:renderDashboard,kind:'dashboard'});
  items.push({ids:['panel-feedback'],label:'💬 피드백',color:'#7c3aed',onshow:renderFeedback,kind:'feedback'});
  items.push({ids:['panel-vitals'],label:'📊 상태관찰',color:'#0f766e',onshow:renderVitals,kind:'vitals'});
  if(cv===0){
    ORDER.forEach((sn,i)=>{const tm=TM[sn]||{};items.push({ids:['panel_'+i],label:tm.t||sn,color:tm.c||'#64748b',kind:'visit'});});
  }else{
    // 2회차 이상: Follow up 단일 탭
    items.push({ids:['panel-followup'],label:'🩺 Follow up',color:'#0ea5a4',onshow:renderFollowup,kind:'visit'});
  }
  items.push({ids:['panel-cancelled'],label:'🗂 취소된 대상자',color:'#94a3b8',onshow:renderCancelled,kind:'cancelled'});
  TABS_META=items;
  items.forEach((it,idx)=>{
    const b=document.createElement('div'); b.className="tab"+(idx===0?" active":"");
    b.textContent=it.label; b.style.background=idx===0?it.color:"#f1f5f9";
    b.onclick=()=>activateTab(idx);
    tabs.appendChild(b);
  });
}
function activateTab(idx){
  const it=TABS_META[idx]; if(!it) return;
  lastActiveKind=it.kind||'visit';
  document.querySelectorAll('.tab').forEach(t=>{t.className="tab";t.style.background="#f1f5f9";});
  document.querySelectorAll('.panel').forEach(p=>p.className=p.className.replace(/\bactive\b/,'').trim());
  const tabEls=document.querySelectorAll('.tab');
  if(tabEls[idx]){ tabEls[idx].className="tab active"; tabEls[idx].style.background=it.color; }
  it.ids.forEach(id=>{const el=document.getElementById(id); if(el) el.className=(el.className+" active").trim();});
  if(it.onshow) it.onshow();
}
// 회차(cv)가 바뀌면 1회차=01~09 개별 탭 / 2회차 이상=Follow up 탭으로 전환하되,
// 대시보드·취소된 대상자를 보고 있었다면 그대로 유지하고, 방문 관련 탭을 보고 있었다면 새 구성의 첫 방문탭으로 이동
function rebuildTabsKeepActive(){
  buildTabs();
  let idx=TABS_META.findIndex(it=>it.kind===lastActiveKind);
  if(idx<0) idx=0;
  activateTab(idx);
}
const DESC={
 "01_고객기본정보":"고객 기본정보·의료/치료·케어관리 정보를 입력합니다.",
 "02_첫방문회복상태확인":"첫 방문 짧은 선별평가. 평가기준 확인 후 노란칸을 선택하면 점수·상세평가 추천이 자동 계산됩니다.",
 "04_증상활력복약평가":"활력·증상·검사·복약 입력 → 복약순응도/요약이 자동 계산됩니다.",
 "05_영양평가":"신체계측·MUST·위장관·SARC-F 입력 → BMI·체중변화율·영양위험이 자동 계산됩니다.",
 "06_기능평가":"SPPB 하위검사 입력 → 기능 점수·등급이 자동 계산됩니다.",
 "07_심리평가":"PHQ-9·GAD-7·ISI·Distress 입력 → 합계·중증도가 자동 계산됩니다.",
 "08_암종별평가":"암종 특이 항목 입력 → 보정 결과가 자동 계산됩니다.",
 "09_핵심평가요약":"위 시트 입력값을 종합한 핵심평가요약입니다. 모든 값이 자동 계산됩니다.",
};
function fieldInput(sn,fld){
  const key=sn+"!"+fld.coord; const v=curFields()[key]??"";
  let el;
  if(fld.type==="select"){
    el=document.createElement('select'); el.className="val";
    const o0=document.createElement('option');o0.value="";o0.textContent="선택하세요";el.appendChild(o0);
    (fld.choices||[]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;el.appendChild(o);});
    el.value=v;
  }else if(fld.type==="textarea"){
    el=document.createElement('textarea'); el.className="val"; el.value=v;
  }else{
    el=document.createElement('input'); el.className="val";
    el.type=(fld.type==="number")?"number":(fld.type==="date"?"date":"text"); el.value=v;
    if(fld.name==='혈압') el.placeholder='예: 120/80';
  }
  el.oninput=()=>{curFields()[key]=el.value; recalc(); refreshCalc(); markDirty(); };
  el.onchange=el.oninput;
  return el;
}
function tagFor(kind){
  if(!kind)return "";
  const k=kind.trim();
  let cls=k==="필수"?"req":(k==="선택"?"opt":(k==="자동"?"auto":""));
  return '<span class="tag '+cls+'">'+k+'</span>';
}
// 행이 속한 섹션 판정 (셀의 행번호 vs 섹션 시작행)
function sectionTitleForRow(sn,coord){
  const r=parseInt(coord.match(/\d+/)[0]);
  const secs=SECT[sn]||[]; let cur="";
  for(const [sr,title] of secs){ if(sr<=r) cur=title; }
  return cur;
}
let CALC_REFS=[]; // {sn,coord,el}
function buildPanels(){
  const panels=document.getElementById('panels'); panels.innerHTML=""; CALC_REFS=[];
  const HDR=CFG.calchdr||{}, POL=CFG.inlinePolicy||{}, RAL=CFG.rowAlabel||{}, SAH=CFG.secAhdr||{};
  function cr(c){const m=/^([A-Z]+)(\d+)$/.exec(c||"");return m?[m[1],+m[2]]:["",0];}
  function chdr(sn,co){return (HDR[sn]&&HDR[sn][co])||"";}
  function ralab(sn,r){return (RAL[sn]&&RAL[sn][String(r)])||"";}

  // SUMMARY 테이블 빌더 (firstcol=true면 맨 왼쪽에 원본 A열 헤더+영역 라벨)
  function buildSummary(p,sn,calcs,firstColHdr,sumInputs){
    const rows={}, cols=[];
    calcs.forEach(c=>{const r=cr(c.coord)[1]; const h=chdr(sn,c.coord)||"";
      (rows[r]=rows[r]||{cells:{}}); rows[r].cells[h]={co:c.coord,name:c.name};
      rows[r].alab=ralab(sn,r);
      if(h && cols.indexOf(h)<0)cols.push(h);});
    // [v8.0] 같은 행의 입력칸(예: 02 J열 '비고')을 요약표 마지막 열로 통합
    const inByRow={}; let inHdr="";
    (sumInputs||[]).forEach(f=>{const r=cr(f.coord)[1]; inByRow[r]=f; if(!inHdr)inHdr=f.name||"비고";
      (rows[r]=rows[r]||{cells:{}}); rows[r].alab=rows[r].alab||ralab(sn,r);});
    const t=document.createElement('table');t.className="inpt sumt";
    let head="<tr>";
    head+="<th>"+esc(firstColHdr||"요약항목")+"</th>";
    cols.forEach(h=>head+="<th>"+esc(h)+"</th>");
    if((sumInputs||[]).length) head+="<th>"+esc(inHdr||"비고")+"</th>";
    head+="</tr>";
    t.innerHTML="<thead>"+head+"</thead>";const tb=document.createElement('tbody');
    Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(r=>{
      const rd=rows[r];const tr=document.createElement('tr');
      const tn=document.createElement('td');tn.className="item";
      tn.textContent=rd.alab|| (Object.values(rd.cells)[0]||{}).name || "";
      tr.appendChild(tn);

    const pol=POL[sn]||{};
    const secList=(SECT[sn]&&SECT[sn].length)?SECT[sn].map(s=>s[1]):[""];
    const appendix=[];

    // ===== 08 암종별: 문항표(ROW) + 관리강도 요약 인라인 =====
    if(isCancer){
      const allCalc=(CALC[sn]||[]);
      // 문항 점수(G열) → 입력행 옆 인라인
      const inputs=SCHEMA[sn];
      const scoreCalc=allCalc.filter(c=>cr(c.coord)[0]==="G");
      const byRow={};const colset=[];
      scoreCalc.forEach(c=>{const r=cr(c.coord)[1];const h=chdr(sn,c.coord)||"점수";
        if(inputs.some(f=>cr(f.coord)[1]===r)){(byRow[r]=byRow[r]||[]).push({co:c.coord,hdr:h,name:c.name});if(colset.indexOf(h)<0)colset.push(h);}});
      buildInputTable(p,sn,inputs,true,colset,byRow);
      // 관리강도 요약(B/C열, 행26~) → 인라인 요약 테이블
      const mgmt=allCalc.filter(c=>cr(c.coord)[0]!=="G");
      if(mgmt.length && pol.__mgmt_inline){

        buildSummary(p,sn,mgmt,"암종");

      panels.appendChild(p); return;
    }

    secList.forEach((secTitle,si)=>{
      const inputs=SCHEMA[sn].filter(f=>(f.section||"")===secTitle);
      const calcs=(CALC[sn]||[]).filter(c=>(c.section||"")===secTitle && c.name);
      if(inputs.length===0 && calcs.length===0) return;
      if(secTitle){const h=document.createElement('div');h.className="section";h.textContent=secTitle;p.appendChild(h);}

      const pinfo=pol[secTitle]||{};
      const mode=pinfo.mode||"";
      const dropHdr=pinfo.dropHdr||[];
      const usedCalc=new Set();

      if(mode==="ROW" && inputs.length){
        const inCols=new Set(inputs.map(f=>cr(f.coord)[0]));
        const byRow={}; const colset=[];
        // 1) 입력행과 같은 행 계산 → 옆 열 인라인 (dropHdr 제외)
        calcs.forEach(c=>{const r=cr(c.coord)[1]; const h=chdr(sn,c.coord)||c.name;
          if(dropHdr.indexOf(h)>=0) return;
          if(inputs.some(f=>cr(f.coord)[1]===r)){ (byRow[r]=byRow[r]||[]).push({co:c.coord,hdr:h,name:c.name}); usedCalc.add(c.coord);
            if(colset.indexOf(h)<0)colset.push(h);}
        });
        // 2) 입력열 단독 자동계산(예: 나이 B10) → 입력표 자동계산 행으로 합류
        const rowFields=inputs.slice();
        calcs.forEach(c=>{const [col,r]=cr(c.coord);const h=chdr(sn,c.coord)||c.name;
          if(dropHdr.indexOf(h)>=0) return;
          if(!usedCalc.has(c.coord) && inCols.has(col) && !inputs.some(f=>cr(f.coord)[1]===r)){
            usedCalc.add(c.coord);
            rowFields.push({coord:c.coord,name:c.name,_autocalc:true,domain:"",inputkind:"",ref:"",source:"",unit:"",interp:"",action:"",note:"자동계산"});
          }
        });
        rowFields.sort((a,b)=>cr(a.coord)[1]-cr(b.coord)[1]);
        buildInputTable(p,sn,rowFields,isCancer,colset,byRow);
      }
      else if(mode==="SUMMARY"){
        // [v8.0] mergeInputs:true → 입력칸(예: '비고')을 요약표 마지막 열로 통합(상단 중복표 제거)
        //         (기본 false: 기존 동작 그대로 — 입력표를 위에 별도 표시)
        const doMerge = pinfo.mergeInputs===true;
        if(!doMerge && inputs.length) buildInputTable(p,sn,inputs,isCancer,[],{});
        buildSummary(p,sn,calcs,pinfo.firstcol?(SAH[sn]&&SAH[sn][secTitle]||"영역"):"", doMerge?inputs:[]);
        calcs.forEach(c=>usedCalc.add(c.coord));
      }
      else{
        if(inputs.length) buildInputTable(p,sn,inputs,isCancer,[],{});
      }

      const rest=calcs.filter(c=>!usedCalc.has(c.coord));
      if(rest.length) appendix.push({secLabel:(secTitle||("("+(si+1)+")")),items:rest});
    });

    if(appendix.length){
      const wrap=document.createElement('div');wrap.className="appendix";
      const ah=document.createElement('div');ah.className="section appendix-head";ah.textContent="별첨) 자동계산 결과";wrap.appendChild(ah);
      appendix.forEach(grp=>{

          const t1=document.createElement('td');t1.className="item";t1.textContent=lab;tr.appendChild(t1);
          const t2=document.createElement('td');const b=document.createElement('div');b.className="calcbox";b.id="calc_"+sn+"_"+c.coord;t2.appendChild(b);tr.appendChild(t2);
          tb.appendChild(tr);CALC_REFS.push({sn:sn,coord:c.coord,el:b,name:c.name});});
        t.appendChild(tb);wrap.appendChild(t);
      });
      p.appendChild(wrap);
    }
    panels.appendChild(p);
  });

  function buildInputTable(p,sn,inputs,isCancer,inlineCols,byRow){
    function cr2(c){const m=/^([A-Z]+)(\d+)$/.exec(c||"");return m?[m[1],+m[2]]:["",0];}
    const has=(k)=>inputs.some(f=>f[k]&&String(f[k]).trim()!=="");
    const cD=has("domain"),cK=has("inputkind"),cRef=has("ref"),cSrc=has("source"),cUnit=has("unit"),cInt=has("interp"),cAct=has("action");
    const t=document.createElement('table');t.className="inpt";
    let head="<tr>";
    if(cD)head+="<th class='mh'>"+(isCancer?"암종":"영역")+"</th>";
    head+="<th>"+(isCancer?"문항":"항목")+"</th>";
    if(cK)head+="<th class='mh'>구분</th>";
    if(cRef)head+="<th class='mh'>기준시점</th>";
    if(cSrc)head+="<th class='mh'>정보출처</th>";
    head+="<th class='vh'>입력값</th>";
    if(cUnit)head+="<th class='mh'>단위/선택</th>";
    if(isCancer){head+="<th class='mh'>입력 기준</th>";if(cInt)head+="<th class='mh'>회복계획 반영</th>";}
    else{if(cInt)head+="<th class='mh'>해석</th>";}
    if(cAct)head+="<th class='mh'>조치/계획</th>";
    (inlineCols||[]).forEach(h=>head+="<th class='ih'>"+esc(h)+"</th>");
    if(!isCancer)head+="<th class='mh'>비고</th>";else head+="<th class='mh'>비고</th>";
    head+="</tr>";
    t.innerHTML="<thead>"+head+"</thead>";const tb=document.createElement('tbody');
    inputs.forEach(fld=>{
      const frow=cr2(fld.coord)[1];const tr=document.createElement('tr');
      if(cD){const td=document.createElement('td');td.className="meta dom";td.textContent=isCancer?(fld.cancer||fld.name||""):(fld.domain||"");tr.appendChild(td);}
      const tdN=document.createElement('td');tdN.className="item";
      let nm;
      if(isCancer){const q=fld.qtext||fld.name||"";nm=esc(q);}
      else{nm=(fld.qnum?("<b>"+fld.qnum+".</b> "):"")+(fld.name||fld.coord);}
      tdN.innerHTML=nm;tr.appendChild(tdN);
      if(cK){const td=document.createElement('td');td.className="meta";td.innerHTML=fld.inputkind?tagFor(fld.inputkind):"";tr.appendChild(td);}
      if(cRef){const td=document.createElement('td');td.className="meta";td.textContent=fld.ref||"";tr.appendChild(td);}
      if(cSrc){const td=document.createElement('td');td.className="meta";td.textContent=fld.source||"";tr.appendChild(td);}
      const tdV=document.createElement('td');tdV.className="vcell";
      if(fld._autocalc){const b=document.createElement('div');b.className="calcbox";b.id="calc_"+sn+"_"+fld.coord;tdV.appendChild(b);CALC_REFS.push({sn:sn,coord:fld.coord,el:b,name:fld.name});}
      else{tdV.appendChild(fieldInput(sn,fld));}
      tr.appendChild(tdV);
      if(cUnit){const td=document.createElement('td');td.className="meta unit";td.textContent=fld.unit||"";tr.appendChild(td);}
      if(isCancer){const tn=document.createElement('td');tn.className="meta note";tn.textContent=fld.note||"";tr.appendChild(tn);
        if(cInt){const td=document.createElement('td');td.className="meta";td.textContent=fld.interp||"";tr.appendChild(td);}}
      else{if(cInt){const td=document.createElement('td');td.className="meta";td.textContent=fld.interp||"";tr.appendChild(td);}}
      if(cAct){const td=document.createElement('td');td.className="meta";td.textContent=fld.action||"";tr.appendChild(td);}
      (inlineCols||[]).forEach(h=>{const td=document.createElement('td');td.className="meta inlinecalc";
        const list=(byRow&&byRow[frow])||[];const hit=list.find(x=>x.hdr===h);
        if(hit){const b=document.createElement('div');b.className="calcbox inline";b.id="calc_"+sn+"_"+hit.co;td.appendChild(b);
          CALC_REFS.push({sn:sn,coord:hit.co,el:b,name:h});}
        tr.appendChild(td);});
      const tdNote=document.createElement('td');tdNote.className="meta note";tdNote.textContent=isCancer?"":(fld.note||"");tr.appendChild(tdNote);
      tb.appendChild(tr);
    });
    t.appendChild(tb);p.appendChild(t);
  }
}

function addDaysStr(dateStr,days){
  if(!dateStr) return "";
  const d=new Date(dateStr+"T00:00:00");
  if(isNaN(d.getTime())) return "";
  d.setDate(d.getDate()+days);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function computeAge(birthStr){
  if(!birthStr) return "";
  const b=new Date(birthStr+"T00:00:00"); if(isNaN(b.getTime())) return "";
  const t=new Date();
  let age=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate())) age--;
  return age;
}

function patientPriorityCare(p){
  // 09_핵심평가요약의 실제 계산결과(B16 1순위/B17 2순위/B18 3순위)를 확인하기 위해
  // 해당 환자의 1회차 데이터를 엔진에 임시로 올렸다가, 끝나면 반드시 현재 화면(cp/cv) 상태로 되돌린다.
  const vfields=(p.visits[0]&&p.visits[0].fields)||{};
  const over={};
  for(const sn of ORDER){
    for(const fld of SCHEMA[sn]){
      const key=sn+"!"+fld.coord;
      let v=vfields[key]; if(v===undefined)v="";
      if(fld.type==="number" && v!=="" && v!==null && !isNaN(Number(v))) v=Number(v);
      over[key]=v;
    }
  }
  Engine.setOverrides(over);
  const cands=[getCalc('09_핵심평가요약','B16'), getCalc('09_핵심평가요약','B17'), getCalc('09_핵심평가요약','B18')];
  const ignore=['','자동추천 유지','집중관리 없음','없음'];
  let result='';
  for(const c of cands){ const s=String(c||"").trim(); if(s && ignore.indexOf(s)<0){ result=(s==='기능'?'운동':s); break; } }
  recalc(); // 엔진 오버라이드를 현재 화면(cp/cv) 기준으로 복원
  return result;
}

function resizeFeedbackImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        const maxDim=1100; let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=()=>reject(new Error('이미지를 읽을 수 없습니다.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

// ---- .docx에서 텍스트 추출 (MiniZip으로 word/document.xml을 읽어 <w:t> 텍스트를 단락 단위로 결합) ----
function extractTextFromDocx(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const u8=new Uint8Array(reader.result);
        const zip=MiniZip.read(u8);
        const xml=zip.getStr('word/document.xml');
        if(!xml){ resolve(''); return; }
        const lines=[];
        const paraRe=/<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g;
        let m;
        while((m=paraRe.exec(xml))){
          const seg=m[1];
          const tRe=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g;
          let tm, line='';
          while((tm=tRe.exec(seg))){
            line+=tm[1].replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
          }
          lines.push(line);
        }
        resolve(lines.join('\n'));
      }catch(e){ reject(new Error('워드 문서를 읽을 수 없습니다.')); }
    };
    reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsArrayBuffer(file);
  });
}
// ---- PDF에서 텍스트 추출 (best-effort: FlateDecode 스트림을 해제하고 Tj/TJ 텍스트 연산자를 읽음, ToUnicode CMap이 있으면 활용) ----
function u8ToBinStr(u8){
  let s=''; const CHUNK=0x8000;
  for(let i=0;i<u8.length;i+=CHUNK) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CHUNK));
  return s;
}
function pdfHexToUnicode(hex){
  let s='';
  for(let i=0;i<hex.length;i+=4){
    const code=parseInt(hex.substr(i,4),16);
    if(!isNaN(code)) s+=String.fromCharCode(code);
  }
  return s;
}
function decodePdfStringToken(tok,cmap){
  if(tok[0]==='<'){
    const hex=tok.slice(1,-1).replace(/\s/g,'');
    let out='';
    for(let i=0;i<hex.length;i+=4){
      const code=hex.substr(i,4).toUpperCase();
      if(code.length<4) break;
      if(cmap[code]!==undefined) out+=cmap[code];
      else{ const n=parseInt(code,16); if(!isNaN(n)) out+=String.fromCharCode(n); }
    }
    return out;
  }else if(tok[0]==='('){
    const inner=tok.slice(1,-1);
    let out='';
    for(let i=0;i<inner.length;i++){
      const c=inner[i];
      if(c==='\\'){
        const n=inner[i+1];
        if(n==='n'){out+='\n';i++;}
        else if(n==='r'){out+='\r';i++;}
        else if(n==='t'){out+='\t';i++;}
        else if(n==='('||n===')'||n==='\\'){out+=n;i++;}
        else{out+=n;i++;}
      }else out+=c;
    }
    return out;
  }
  return '';
}
function decodeASCII85(str){
  str=str.replace(/\s/g,'');
  const endIdx=str.indexOf('~>');
  if(endIdx>=0) str=str.slice(0,endIdx);
  const out=[];
  let i=0;
  while(i<str.length){
    if(str[i]==='z'){ out.push(0,0,0,0); i++; continue; }
    let chunk=str.slice(i,i+5);
    i+=chunk.length;
    const n=chunk.length;
    while(chunk.length<5) chunk+='u';
    let val=0;
    for(let k=0;k<5;k++) val=val*85+(chunk.charCodeAt(k)-33);
    const bytes=[(val>>>24)&0xFF,(val>>>16)&0xFF,(val>>>8)&0xFF,val&0xFF];
    for(let k=0;k<n-1;k++) out.push(bytes[k]);
  }
  return new Uint8Array(out);
}
// ---- PDF에 포함된 이미지(사진 형태로 내보낸 슬라이드 등, JPEG로 저장된 것) 추출 ----
function extractImagesFromPdf(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const u8=new Uint8Array(reader.result);
        const bin=u8ToBinStr(u8);
        const objRe=/(\d+)\s+(\d+)\s+obj([\s\S]*?)endobj/g;
        const images=[];
        let om;
        while((om=objRe.exec(bin))){
          const body=om[3];
          if(!/\/Subtype\s*\/Image/.test(body)) continue;
          if(!/\/DCTDecode/.test(body)) continue; // 우선 JPEG(DCTDecode)만 지원
          const streamIdx=body.indexOf('stream');
          if(streamIdx===-1) continue;
          let dataStart=streamIdx+6;
          if(body.substr(dataStart,2)==='\r\n') dataStart+=2;
          else if(body[dataStart]==='\n') dataStart+=1;
          const endIdx=body.indexOf('endstream',dataStart);
          if(endIdx===-1) continue;
          const raw=body.slice(dataStart,endIdx);
          const rawU8=new Uint8Array(raw.length);
          for(let i=0;i<raw.length;i++) rawU8[i]=raw.charCodeAt(i)&0xFF;
          let dataU8=rawU8;
          const filterMatch=body.slice(0,streamIdx).match(/\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/);
          if(filterMatch){
            const filters=filterMatch[1].match(/\/[A-Za-z0-9]+/g)||[];
            for(const filt of filters){
              if(filt==='/ASCII85Decode'){ try{ dataU8=decodeASCII85(u8ToBinStr(dataU8)); }catch(e){} }
              // /DCTDecode(JPEG)는 그대로가 완성된 JPEG 바이트이므로 추가 처리가 필요 없음
            }
          }
          let b64;
          try{ b64=btoa(u8ToBinStr(dataU8)); }catch(e){ continue; }
          images.push('data:image/jpeg;base64,'+b64);
        }
        resolve(images);
      }catch(e){ reject(new Error('PDF에서 이미지를 추출할 수 없습니다.')); }
    };
    reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsArrayBuffer(file);
  });
}
function extractTextFromPdf(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const u8=new Uint8Array(reader.result);
        const bin=u8ToBinStr(u8);
        const objRe=/(\d+)\s+(\d+)\s+obj([\s\S]*?)endobj/g;
        const streams=[]; const cmap={};
        let om;
        while((om=objRe.exec(bin))){
          const body=om[3];
          const streamIdx=body.indexOf('stream');
          if(streamIdx===-1) continue;
          const dict=body.slice(0,streamIdx);
          let dataStart=streamIdx+6;
          if(body.substr(dataStart,2)==='\r\n') dataStart+=2;
          else if(body[dataStart]==='\n') dataStart+=1;
          const endIdx=body.indexOf('endstream',dataStart);
          if(endIdx===-1) continue;
          const raw=body.slice(dataStart,endIdx);
          const rawU8=new Uint8Array(raw.length);
          for(let i=0;i<raw.length;i++) rawU8[i]=raw.charCodeAt(i)&0xFF;
          let dataU8=rawU8;
          const filterMatch=dict.match(/\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/);
          if(filterMatch){
            const filters=filterMatch[1].match(/\/[A-Za-z0-9]+/g)||[];
            let ok=true;
            for(const filt of filters){
              try{
                if(filt==='/ASCII85Decode') dataU8=decodeASCII85(u8ToBinStr(dataU8));
                else if(filt==='/FlateDecode') dataU8=MiniZip.inflateRaw(dataU8.subarray(2));
                // LZWDecode·ASCIIHexDecode·RunLengthDecode·DCT(이미지) 등은 지원하지 않아 건너뜀
              }catch(e){ ok=false; break; }
            }
            if(!ok) continue;
          }
          streams.push({dict,dataU8});
        }
        streams.forEach(s=>{
          const txt=u8ToBinStr(s.dataU8);
          if(txt.indexOf('beginbfchar')===-1 && txt.indexOf('beginbfrange')===-1) return;
          const charSecRe=/beginbfchar([\s\S]*?)endbfchar/g; let cs;
          while((cs=charSecRe.exec(txt))){
            const re2=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let mm;
            while((mm=re2.exec(cs[1]))){ cmap[mm[1].toUpperCase()]=pdfHexToUnicode(mm[2]); }
          }
          const rangeSecRe=/beginbfrange([\s\S]*?)endbfrange/g; let rs;
          while((rs=rangeSecRe.exec(txt))){
            const re3=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let mm3;
            while((mm3=re3.exec(rs[1]))){
              const lo=parseInt(mm3[1],16), hi=parseInt(mm3[2],16), dstStart=parseInt(mm3[3],16);
              for(let c=lo;c<=hi && c-lo<1000;c++){
                const src=c.toString(16).toUpperCase().padStart(mm3[1].length,'0');
                cmap[src]=String.fromCharCode(dstStart+(c-lo));
              }
            }
          }
        });
        const out=[];
        streams.forEach(s=>{
          const txt=u8ToBinStr(s.dataU8);
          if(txt.indexOf('BT')===-1 || (txt.indexOf('Tj')===-1 && txt.indexOf('TJ')===-1)) return;
          const tokRe=/\((?:\\.|[^\\()])*\)\s*Tj|<[0-9A-Fa-f\s]*>\s*Tj|\[(?:[^\[\]]|\[[^\[\]]*\])*\]\s*TJ|\bT\*|\bTD\b|\bTd\b/g;
          let tm2;
          while((tm2=tokRe.exec(txt))){
            const tok=tm2[0];
            if(/^(T\*|TD|Td)$/.test(tok)){ out.push('\n'); continue; }
            if(tok.endsWith('Tj')){
              out.push(decodePdfStringToken(tok.slice(0,-2).trim(),cmap));
            }else if(tok.endsWith('TJ')){
              const arrPart=tok.slice(0,-2).trim();
              const pieceRe=/\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>/g; let pm;
              while((pm=pieceRe.exec(arrPart))) out.push(decodePdfStringToken(pm[0],cmap));
            }
          }
          out.push('\n');
        });
        resolve(out.join('').replace(/\n{3,}/g,'\n\n').trim());
      }catch(e){ reject(new Error('PDF를 읽을 수 없습니다.')); }
    };
    reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsArrayBuffer(file);
  });
}

function dl(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
// ---------- 헤더 JSON 내보내기/불러오기 (등록 앱) ----------
(function(){
  const expBtn=document.getElementById('hdrExportBtn');
  if(expBtn) expBtn.onclick=()=>{
    dl("힐마루케어_전체백업_"+new Date().toISOString().slice(0,10)+".json",{type:"all",version:CFG.version,state:state});
  };
  const impBtn=document.getElementById('hdrImportBtn');
  const impInp=document.getElementById('hdrImportInput');
  if(!impBtn||!impInp) return;
  impBtn.onclick=()=>impInp.click();
  impInp.onchange=(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      let parsed; try{ parsed=JSON.parse(ev.target.result); }catch(err){ alert("JSON 파일을 읽을 수 없습니다."); return; }
      let newState=null;
      if(parsed.type==='all' && parsed.state){ newState=parsed.state; }
      else if(parsed.type==='patient' && parsed.patient){
        newState=JSON.parse(JSON.stringify(state));
        const name=parsed.patient.name;
        const idx=newState.patients.findIndex(p=>p.name===name);
        if(idx>=0){ newState.patients[idx]=parsed.patient; }
        else{ newState.patients.push(parsed.patient); }
      } else if(parsed.type==='schedAll' && parsed.state && Array.isArray(parsed.state.visits)){
        // [v34.28] 일정메뉴 백업(JSON)의 '대상자체크' 값을 이름이 같은 대상자에게 채움
        newState=JSON.parse(JSON.stringify(state));
        const keys=window.REG_CHECK_KEYS||[];
        const byName={};
        parsed.state.visits.forEach(r=>{ if(r && r.name && !byName[String(r.name).trim()]) byName[String(r.name).trim()]=r; });
        const hit=[], miss=[];
        newState.patients.forEach(p=>{
          const r=byName[String(p.name||'').trim()];
          if(!r){ miss.push(p.name); return; }
          if(!p.check||typeof p.check!=='object') p.check={};
          keys.forEach(k=>{ if(r[k]!==undefined && r[k]!==null && r[k]!=='') p.check[k]=String(r[k]); });
          hit.push(p.name);
        });
        const extraNames=Object.keys(byName).filter(n=>!newState.patients.some(p=>String(p.name||'').trim()===n));
        let msg='일정메뉴 대상자체크 값을 '+hit.length+'명에게 채울게요.';
        if(miss.length) msg+='\n\n일정메뉴에 없어서 빈칸으로 두는 대상자: '+miss.join(', ');
        if(extraNames.length) msg+='\n\n등록 대상자에 없어서 건너뛰는 이름: '+extraNames.join(', ');
        msg+='\n\n진행할까요?';
        if(window.RegFB && window.RegFB.ready()){ window.RegFB.importState(newState, msg, true); return; }
        if(!confirm(msg)) return;
      } else { alert("지원하지 않는 JSON 형식입니다.\n(등록 앱 백업 파일 또는 일정메뉴 백업 파일을 선택해주세요)"); return; }

function numLike(v){return v!==""&&v!==null&&v!==undefined&&!isNaN(Number(v))&&/^-?\d*\.?\d+$/.test(String(v).trim());}
// 셀 XML 교체 헬퍼 (수식 제거하고 값/문자열로 기록, 서식 s="" 유지) — exportXlsx / exportFollowupXlsx 공용
function writeCell(xml,coord,val,isNum,formula){
  // 셀 전체(자가닫힘 <c .../> 또는 <c ...>...</c>)를 정확히 캡처
  const re=new RegExp('<c r="'+coord+'"((?:[^>"]|"[^"]*")*?)(?:/>|>(?:[^<]|<(?!/c>))*<\\/c>)');
  const m=xml.match(re); if(!m)return xml;
  // 여는 태그 속성에서 t="..." 제거 (다시 쓰기 위해)
  let attrs=m[1].replace(/\s+t="[^"]*"/g,"");
  let cellXml;
  if(formula){
    // 자동계산: 수식을 보존하고, 계산 결과를 캐시값(<v>)으로 함께 기록 → 엑셀에서 즉시 표시 + 라이브 재계산
    const fx=xmlEsc(String(formula).replace(/^=/,""));
    if(isNum){ cellXml='<c r="'+coord+'"'+attrs+'><f>'+fx+'</f><v>'+Number(val)+'</v></c>'; }
    else if(val===""||val===null||val===undefined){ cellXml='<c r="'+coord+'"'+attrs+'><f>'+fx+'</f></c>'; }
    else { cellXml='<c r="'+coord+'"'+attrs+' t="str"><f>'+fx+'</f><v>'+xmlEsc(String(val))+'</v></c>'; }
  }
  else if(val===""||val===null||val===undefined){ cellXml='<c r="'+coord+'"'+attrs+'/>'; }
  else if(isNum){ cellXml='<c r="'+coord+'"'+attrs+'><v>'+Number(val)+'</v></c>'; }
  else { cellXml='<c r="'+coord+'"'+attrs+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>'; }
  return xml.slice(0,m.index)+cellXml+xml.slice(m.index+m[0].length);
}
async function exportXlsx(){
  recalc();
  const u8=b64toU8(B64);
  const zip=MiniZip.read(u8);
  const wbXml=zip.getStr("xl/workbook.xml");
  const relXml=zip.getStr("xl/_rels/workbook.xml.rels");
  const nameToRid={}; (wbXml.match(/<sheet[^>]*\/>/g)||[]).forEach(t=>{const n=t.match(/name="([^"]*)"/),r=t.match(/r:id="([^"]*)"/);if(n&&r)nameToRid[n[1]]=r[1];});
  const ridToTarget={}; (relXml.match(/<Relationship[^>]*\/>/g)||[]).forEach(t=>{const id=t.match(/Id="([^"]*)"/),tg=t.match(/Target="([^"]*)"/);if(id&&tg)ridToTarget[id[1]]=tg[1];});
  function sheetPath(sn){let tg=ridToTarget[nameToRid[sn]];if(!tg)return null;if(!tg.startsWith("xl/"))tg="xl/"+tg.replace(/^\//,"");return tg;}

  const f=curFields();
  for(const sn of ORDER){
    const path=sheetPath(sn); if(!path||!zip.file(path))continue;
    let xml=zip.getStr(path);
    // 1) 사용자 입력셀 기록
    for(const fld of SCHEMA[sn]){
      const key=sn+"!"+fld.coord; let v=f[key]; if(v===undefined)v="";
      const isNum=(fld.type==="number" && numLike(v));
      xml=writeCell(xml,fld.coord,v,isNum);
    }
    // 2) 자동계산셀: 자체 엔진 결과를 '값'으로 기록 (엑셀 안 열어도/재계산 없이 결과 표시)
    const calcs=(CALC[sn]||[]);
    for(const c of calcs){
      let v=getCalc(sn,c.coord);
      const isNum=numLike(v);
      // 원본 수식 가져오기 (있으면 수식 보존 + 결과 캐시)
      const orig=(WB.cells[sn]||{})[c.coord];
      let formula=null;
      if(typeof orig==="string"&&orig[0]==="=") formula=orig;
      else if(orig&&typeof orig==="object"&&typeof orig.v==="string"&&orig.v[0]==="=") formula=orig.v;
      xml=writeCell(xml,c.coord,(v===""?"":(isNum?Number(v):v)),isNum,formula);
    }
    zip.set(path,xml);
  }
  // --- 수식 제거에 따른 calcChain.xml 정리 (Excel 복구경고 방지) ---
  try{
    if(zip.file && zip.file("xl/calcChain.xml")){ zip.remove ? zip.remove("xl/calcChain.xml") : (function(){ if(zip.files) delete zip.files["xl/calcChain.xml"]; })(); }
    // workbook rels에서 calcChain 관계 제거
    if(zip.file && zip.file("xl/_rels/workbook.xml.rels")){
      let r=zip.getStr("xl/_rels/workbook.xml.rels");
      r=r.replace(/<Relationship[^>]*calcChain\.xml[^>]*\/>/g,"");
      zip.set("xl/_rels/workbook.xml.rels",r);
    }
    // [Content_Types].xml 에서 calcChain override 제거
    if(zip.file && zip.file("[Content_Types].xml")){
      let ct=zip.getStr("[Content_Types].xml");
      ct=ct.replace(/<Override[^>]*calcChain\.xml[^>]*\/>/g,"");
      zip.set("[Content_Types].xml",ct);
    }
    // workbook.xml: fullCalcOnLoad 설정 (열 때 자동 재계산)
    if(zip.file && zip.file("xl/workbook.xml")){
      let wx=zip.getStr("xl/workbook.xml");
      if(/<calcPr[^>]*\/>/.test(wx)) wx=wx.replace(/<calcPr[^>]*\/>/,'<calcPr calcId="0" fullCalcOnLoad="1"/>');
      else if(/<\/workbook>/.test(wx)) wx=wx.replace(/<\/workbook>/,'<calcPr calcId="0" fullCalcOnLoad="1"/></workbook>');
      zip.set("xl/workbook.xml",wx);
    }
  }catch(e){}
  const out=MiniZip.write(zip);
  const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const p=state.patients[cp];
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download="힐마루케어_"+p.name+"_"+p.visits[cv].date+".xlsx";a.click();
}

<script>
/* ===== v20.7: 방법A(JSON파일 연결) + 방법B(앱+데이터 HTML 다운로드) ===== */
(function(){
  let _fh=null;               // File System Access API 핸들
  let _timer=null;            // debounce 타이머

  /* ---------- 방법A: 파일에 저장 ---------- */
  function scheduleFileSave(){
    if(!_fh) return;
    clearTimeout(_timer);
    _timer=setTimeout(doFileSave, 400);
  }

  async function doFileSave(){
    if(!_fh) return;
    try{
      const writable=await _fh.createWritable();
      const pState=(typeof state!=='undefined')?{patients:state.patients,cancelled:state.cancelled}:null;
      const sState=(window.SchedApp&&window.SchedApp.getState)?window.SchedApp.getState():null;
      const data={version:'v20.7',ts:Date.now(),patientState:pState,schedState:sState};
      await writable.write(JSON.stringify(data,null,2));
      await writable.close();
      setBtnStyle('ok');
    }catch(e){
      console.warn('파일 저장 실패:',e);
      setBtnStyle('err');
    }
  }

  function setBtnStyle(status){
    const name=_fh?(_fh.name||'data.json'):'';
    ['fileSaveBtn','fileSaveBtn2'].forEach(id=>{
      const el=document.getElementById(id);
      if(!el) return;
      if(!_fh){
        el.textContent='📁 파일 연결';
        el.style.cssText='';
      } else if(status==='ok'){
        el.textContent='📁 '+name+' ✓';
        el.style.cssText='background:#059669;color:#fff;';
        el.title='연결됨: '+name+' (클릭 → 해제)';
      } else if(status==='err'){
        el.textContent='⚠ 파일 저장 실패';
        el.style.cssText='background:#dc2626;color:#fff;';
      } else {
        el.textContent='📁 '+name;
        el.style.cssText='background:#0369a1;color:#fff;';
        el.title='연결됨: '+name+' (클릭 → 해제)';
      }
    });
  }

  async function connectOrDisconnect(){
    if(_fh){
      if(confirm('파일 연결을 해제할까요?\n해제 후에는 브라우저 자동저장만 사용합니다.')){
        _fh=null; setBtnStyle();
      }
      return;
    }
    if(!window.showOpenFilePicker&&!window.showSaveFilePicker){
      alert('이 브라우저는 파일 연결(File System Access API)을 지원하지 않습니다.\nChrome 또는 Edge 브라우저를 사용해주세요.\n\n대신 [🌐 앱+데이터 저장] 버튼으로 HTML 파일을 다운로드할 수 있습니다.');
      return;
    }
    const openMode=confirm('JSON 파일 선택:\n[확인] 기존 파일 열기\n[취소] 새 파일 만들기');
    try{
      let h;
      const opts={types:[{description:'힐마루케어 데이터',accept:{'application/json':['.json']}}]};
      if(openMode && window.showOpenFilePicker){
        const [picked]=await window.showOpenFilePicker({...opts,multiple:false});
        h=picked;
        // 파일 내 데이터 복원 여부
        const f=await h.getFile();
        let parsed=null;
        try{ parsed=JSON.parse(await f.text()); }catch(e){}
        if(parsed&&(parsed.patientState||parsed.schedState)){
          if(confirm('이 파일의 저장 데이터를 불러올까요?\n[확인]: 파일 데이터로 복원\n[취소]: 연결만 하고 현재 데이터 유지')){
            if(parsed.patientState&&typeof state!=='undefined'&&Array.isArray(parsed.patientState.patients)){
              state.patients=parsed.patientState.patients;
              state.cancelled=Array.isArray(parsed.patientState.cancelled)?parsed.patientState.cancelled:[];
              if(typeof reload==='function') reload();
              if(typeof renderDashboard==='function') renderDashboard();
              if(typeof renderFollowup==='function') renderFollowup();
              if(typeof renderCancelled==='function') renderCancelled();
            }
            if(parsed.schedState&&window.SchedApp&&window.SchedApp.setState){
              window.SchedApp.setState(parsed.schedState);
            }
          }
        }
      } else {
        h=await window.showSaveFilePicker({
          ...opts,
          suggestedName:'힐마루케어_데이터_'+new Date().toISOString().slice(0,10)+'.json'
        });
      }
      _fh=h;
      setBtnStyle('connected');
      await doFileSave(); // 즉시 1회 저장
    }catch(e){
      if(e.name!=='AbortError') alert('파일 연결 실패: '+e.message);
    }
  }

  /* ---------- 방법B: 데이터 내장 HTML 다운로드 ---------- */
  function downloadHtmlWithData(){
    const pState=(typeof state!=='undefined')?{patients:state.patients,cancelled:state.cancelled}:{patients:[],cancelled:[]};
    const sState=(window.SchedApp&&window.SchedApp.getState)?window.SchedApp.getState():{};
    // <\/script> 시퀀스가 JSON 안에 있으면 HTML 파싱을 깨므로 이스케이프
    function safeJson(obj){
      return JSON.stringify(obj).replace(/<\/script/gi,'<\\/script');
    }
    const patJson=safeJson(pState);
    const schedJson=safeJson(sState);
    let html=document.documentElement.outerHTML;
    // mainbackup 내용 교체 (그리디하지 않게 첫 번째만)
    html=html.replace(/(<script[^>]*id="mainbackup"[^>]*>)([\s\S]*?)(<\/script>)/,
      function(_,open,_c,close){ return open+patJson+close; });
    // schedbackup 내용 교체
    html=html.replace(/(<script[^>]*id="schedbackup"[^>]*>)([\s\S]*?)(<\/script>)/,
      function(_,open,_c,close){ return open+schedJson+close; });
    const blob=new Blob(['<!doctype html>'+html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='힐마루케어회복관리입력_'+new Date().toISOString().slice(0,10)+'.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),15000);
  }

  /* ---------- 전역 노출 ---------- */
  window.hilmaruFileSave=scheduleFileSave;
  window.hilmaruHtmlDownload=downloadHtmlWithData;

  /* ---------- 버튼 클릭 와이어링 ---------- */
  document.getElementById('fileSaveBtn')&&(document.getElementById('fileSaveBtn').onclick=connectOrDisconnect);
  document.getElementById('fileSaveBtn2')&&(document.getElementById('fileSaveBtn2').onclick=connectOrDisconnect);
  document.getElementById('htmlDlBtn')&&(document.getElementById('htmlDlBtn').onclick=downloadHtmlWithData);
  document.getElementById('htmlDlBtn2')&&(document.getElementById('htmlDlBtn2').onclick=downloadHtmlWithData);
})();
</script>

    }
    if(cp>=state.patients.length) cp=0;
    if(!state.patients[cp].visits[cv]) cv=0;
    reload(); renderDashboard(); renderFollowup(); renderCancelled();

    return !!(a && a.closest && a.closest('#appRoot') && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id!=='selPat' && a.id!=='selVisit');

const SLOW_MS = 15000;

function stat(t, bad) { const el = $('fbSyncStatus'); if (el) { el.textContent = t; el.style.color = bad ? '#fca5a5' : '#7dd3fc'; } }
const EMPTY = { pats: [], meta: null };

const S = { uid: null, email: '', loaded: false, synced: null, last: null, timer: null, saving: false, again: false, deferred: false, dbM: null, ref: null, unsub: null, online: true };

    if (ok) {
      btnState('✔ 저장됨', '#16a34a');
      stat('✔ Firebase 저장 확인됨 · ' + tm() + ' (대상자 ' + n + '명)');
      clearFail();
    } else {
      failManual('저장은 보냈지만 Firebase에서 확인이 안 됐어요.\n잠시 후 💾 저장을 다시 눌러 주세요.');
    }
  } finally {
    manualBusy = false;
    btnResetT = setTimeout(() => { document.querySelectorAll('.tabSaveBtn').forEach(b => { b.textContent = '💾 저장'; b.style.background = '#16a34a'; }); }, 3000);
  }
}
// [v34.27] 탭마다 제목 옆에 💾 저장 버튼 — 화면이 다시 그려져도 자동으로 다시 붙음
const SAVE_BTN_CSS = 'background:#16a34a;color:#fff;border:none;border-radius:8px;padding:5px 13px;font-size:14px;font-weight:700;cursor:pointer;vertical-align:middle;box-shadow:0 1px 3px rgba(0,0,0,.15)';
function makeSaveBtn(extra) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tabSaveBtn no-print'; b.title = '이 탭에 입력한 내용을 지금 바로 Firebase에 저장 (Ctrl+S)'; b.textContent = '💾 저장'; b.style.cssText = SAVE_BTN_CSS + ';' + (extra || ''); return b; }
function ensureSaveBtns() {
  document.querySelectorAll('#appRoot .panel').forEach(pn => {
    if (pn.id === 'panels') return;
    if (pn.querySelector('.tabSaveBtn')) return;
    const h2 = pn.querySelector('.dashHead h2');
    if (h2) { h2.appendChild(makeSaveBtn('margin-left:12px')); return; }
    const desc = pn.querySelector(':scope > .desc');
    if (desc) { desc.insertBefore(makeSaveBtn('float:right;margin:-3px 0 0 10px'), desc.firstChild); }
  });
}
let ensureQueued = false;
new MutationObserver(() => { if (ensureQueued) return; ensureQueued = true; requestAnimationFrame(() => { ensureQueued = false; ensureSaveBtns(); }); }).observe($('appRoot'), { childList: true, subtree: true });
ensureSaveBtns();
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.tabSaveBtn')) e.preventDefault(); }, true);   // 버튼 누를 때 화면이 다시 그려져 클릭이 사라지지 않게
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.tabSaveBtn'); if (b) { e.preventDefault(); manualSave(); } });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); manualSave(); } });
function schedule() { if (!S.loaded) return; clearTimeout(S.timer); S.timer = setTimeout(saveNow, 1200); }
const prevHook = window.hilmaruFileSave;
window.hilmaruFileSave = function () { if (typeof prevHook === 'function') { try { prevHook(); } catch (e) {} } schedule(); };  // 등록 앱 autosave()가 부를 때마다

// 다른 기기에서 바뀐 내용 반영: 이 화면에 안 올린 변경이 없고, 입력 중이 아닐 때만
function considerRemote() {
  const cloud = S.last; if (!cloud || !S.loaded) return;
  const local = window.RegApp.parts();
  if (same(local, cloud)) { S.synced = cloud; S.deferred = false; return; }
  if (S.saving) return;
  if (!same(local, S.synced) || window.RegApp.focused()) {
    if (!S.deferred) notice('다른 기기에서 등록 데이터가 바뀌었어요. 지금 입력한 내용이 저장된 뒤 반영돼요.', 7000);
    S.deferred = true; return;
  }
  S.deferred = false; S.synced = cloud;
  window.RegApp.apply(cloud);
  notice('다른 기기에서 바뀐 내용을 반영했어요');
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.deferred && !window.RegApp.focused()) considerRemote(); }, 300));

function onSnap(snap) {
  const cloud = cloudParts(snap.val());
  S.last = cloud;
  if (S.saving) S.snapDuringSave = true;
  if (S.loaded) { considerRemote(); return; }
  S.loaded = true;
  const owner = lsGet(OWNER_KEY);
  const localMine = !owner || owner === S.uid;
  lsSet(OWNER_KEY, S.uid);
  gate(false);
  if (!cloud.pats.length) {           // Firebase가 비어 있음 → 처음 연결
    S.synced = EMPTY;
    if (window.__regLocalHad && localMine) {
      notice('이 브라우저에 남아 있던 대상자 ' + state.patients.length + '명을 Firebase에 올리고 있어요.', 8000);
    } else {
      if (!localMine) window.RegApp.apply({ pats: [], meta: JSON.stringify({ folderList: [], cancelled: [] }) });
      notice('Firebase에 등록 데이터가 아직 없어요. 예전 파일의 데이터는 그 파일에서 <b>📤 JSON 내보내기</b> → 여기서 <b>📥 JSON 불러오기</b>로 옮겨 주세요.', 0);
    }
    saveNow().then(r => { if (r === 'saved') dropLocalData(); });
    return;
  }
  // [v34.29] 항상 Firebase 내용을 기준으로 불러옴 (브라우저에는 데이터를 두지 않음)
  S.synced = cloud;
  window.RegApp.apply(cloud);
  dropLocalData();
  stat('✔ Firebase에서 불러옴 · ' + tm());
}

// 📥 JSON 불러오기 → Firebase 데이터를 파일 내용으로 교체
window.RegFB = {
  ready: () => !!(S.uid && S.loaded),
  importState: (st, msg, keepPos) => {
    if (!confirm(msg || 'Firebase에 저장된 등록 데이터를 이 파일 내용으로 바꿀까요?\n(되돌릴 수 없어요. 필요하면 먼저 📤 JSON 내보내기로 백업해 두세요.)')) return;
    if (!keepPos) { cp = 0; cv = 0; }
    window.RegApp.apply(window.RegApp.partsOf(st));
    saveNow().then(() => notice('불러온 내용을 Firebase에 저장했어요 (대상자 ' + state.patients.length + '명)'));
  },
};
window.addEventListener('beforeunload', () => {
  if (!S.loaded) return;
  if (S.timer || S.saving || !same(window.RegApp.parts(), S.synced)) { setPending(true); saveNow(); }
});

if (location.protocol === 'file:') {
  gate(true, '사이트 주소로 열어 주세요', '이 파일은 업무관리·출장서류와 같은 사이트에 올려서 열어야 Firebase에 저장돼요.<br>파일을 더블클릭해서 열면 구글 로그인이 되지 않아요.', false);
  stat('Firebase 연결 안 됨 (파일로 열림)', true);
} else {
  try {
    const B = 'https://www.gstatic.com/firebasejs/11.1.0/';
    const [appM, authM, dbM] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-database.js')]);
    const app = appM.initializeApp(firebaseConfig);
    const auth = authM.getAuth(app), db = dbM.getDatabase(app);
    S.dbM = dbM;
    let wasOffline = false, offT = null;
    dbM.onValue(dbM.ref(db, '.info/connected'), s => {
      S.online = !!s.val();
      clearTimeout(offT);
      if (!S.online) {   // 잠깐 끊겼다 붙는 건 무시하고 5초 이상 끊기면 알림
        offT = setTimeout(() => { if (S.online || !S.loaded) return; wasOffline = true; stat('⚠ 오프라인 — Firebase에 저장 안 됨', true); showFail('⚠ 인터넷 연결이 끊겨서 Firebase에 저장되지 않고 있어요<br><span style="font-weight:500;font-size:14px">지금 입력하는 내용은 아직 저장되지 않았어요. 이 창을 닫지 말고 기다려 주세요. 다시 연결되면 자동으로 올라가요.</span>', 'offline'); }, 5000);
      } else if (wasOffline) {
        wasOffline = false; clearFail('offline'); stat('✔ Firebase 다시 연결됨 · ' + tm()); notice('인터넷이 다시 연결됐어요. 저장 안 된 내용이 있으면 Firebase에 올려요.'); if (S.loaded) saveNow();
      }
    });
    authM.onAuthStateChanged(auth, user => {
      if (S.unsub) { S.unsub(); S.unsub = null; }
      S.loaded = false; S.synced = null; S.last = null; S.deferred = false;
      if (!user) {
        S.uid = null;
        stat('로그인 필요', true);
        gate(true, '업무관리 로그인이 필요해요', '등록 데이터는 업무관리와 같은 구글 계정의 Firebase에 저장돼요.<br>업무관리에서 로그인하면 이 화면이 자동으로 열려요.', true);
        return;
      }
      S.uid = user.uid; S.email = user.email || '';
      S.ref = dbM.ref(db, `workmgr/${user.uid}/regApp`);
      gate(true, 'Firebase에서 불러오는 중…', (S.email ? S.email + '<br>' : '') + '잠시만 기다려 주세요.', false);
      stat((S.email ? S.email + ' · ' : '') + 'Firebase 불러오는 중…');
      S.unsub = dbM.onValue(S.ref, onSnap, err => {
        console.error(err);
        gate(true, 'Firebase에서 불러오지 못했어요', (err.code || err.message || err) + '<br>로그인 계정과 인터넷 연결을 확인해 주세요.', true);
      });
    });
  } catch (e) {
    console.error(e);
    stat('Firebase 연결 실패', true);
    gate(true, 'Firebase에 연결하지 못했어요', '인터넷 연결을 확인하고 새로고침해 주세요.<br><small>' + (e.message || e) + '</small>', true);
  }
}
</script>
</body></html>
